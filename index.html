<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYO Lifestyle | Defined by Excellence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

    <!-- Top Header -->
    <header class="header">
        <div class="nav-container">
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <div class="logo">SKYO<span>.</span></div>
            <div class="header-icons">
                <i class="fas fa-search"></i>
                <i class="far fa-heart"></i>
                <div class="cart-trigger" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="badge">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Side Mobile Menu -->
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <h3>Menu</h3>
            <span onclick="toggleMenu()">&times;</span>
        </div>
        <ul>
            <li><a href="#" onclick="filterCategory('all')">All Items</a></li>
            <li><a href="#" onclick="filterCategory('fashion')">Men</a></li>
            <li><a href="#" onclick="filterCategory('fashion')">Women</a></li>
            <li><a href="#" onclick="filterCategory('gadgets')">Gadgets</a></li>
            <li><a href="#" onclick="filterCategory('gadgets')">Accessories</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <main>
        <!-- Twelve Style Banner -->
        <section class="lifestyle-banner">
            <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1000" alt="Banner">
            <div class="banner-content">
                <button class="shop-now-btn">Shop Now</button>
            </div>
        </section>

        <section class="container">
            <div id="productsGrid" class="products-grid">
                <!-- Products load here -->
            </div>
        </section>
    </main>

    <!-- Sticky Bottom Navigation (Gadget & Gear Style) -->
    <div class="bottom-nav">
        <a href="#"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#"><i class="fas fa-gift"></i><span>Offers</span></a>
        <a href="https://wa.me/8801601193696" class="wa-nav"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
        <a href="tel:01601193696"><i class="fas fa-phone"></i><span>Call</span></a>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Your Bag</h3>
            <span onclick="toggleCart()">&times;</span>
        </div>
        <div id="cartItems"></div>
        <div class="cart-footer">
            <div class="total-row"><strong>Total:</strong> <span id="subtotal">৳0</span></div>
            <button class="btn-checkout" onclick="openCheckout()">Checkout Now</button>
        </div>
    </div>

    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
