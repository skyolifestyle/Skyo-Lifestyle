<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYO Lifestyle | Premium Fashion & Gadgets</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

    <!-- Glass Navbar -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo">SKYO<span>.</span></div>
            <div class="nav-links">
                <a href="#" onclick="filterCategory('all')">New Arrivals</a>
                <a href="#" onclick="filterCategory('fashion')">Fashion</a>
                <a href="#" onclick="filterCategory('gadgets')">Gadgets</a>
            </div>
            <div class="nav-icons">
                <a href="#" class="search-trigger"><i class="fas fa-search"></i></a>
                <a href="#" class="cart-trigger" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="badge">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <span class="hero-tag">Summer Collection 2026</span>
            <h1>The New Era of Lifestyle.</h1>
            <p>Experience premium quality fashion and cutting-edge gadgets designed for you.</p>
            <button class="btn-primary" onclick="document.getElementById('shop').scrollIntoView()">Explore Shop</button>
        </div>
    </section>

    <!-- Products Section -->
    <main id="shop" class="container">
        <div class="section-title">
            <h2>Featured Collections</h2>
            <p>Handpicked products for your premium lifestyle</p>
        </div>
        <div id="productsGrid" class="products-grid">
            <!-- JS will load products here -->
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Your Bag</h3>
            <button onclick="toggleCart()" class="close-cart">&times;</button>
        </div>
        <div id="cartItems" class="cart-items">
            <!-- Items load here -->
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>Subtotal</span>
                <span id="subtotal">৳0</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">Checkout Now</button>
            <button class="wa-btn" onclick="orderViaWhatsApp()">Order via WhatsApp</button>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
